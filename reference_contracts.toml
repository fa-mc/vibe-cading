# Reference conformance contracts.
#
# Sibling of `visual_contracts.toml`. That file pins "committed == regenerable";
# this one pins "our model == the reference, EXCEPT where we say otherwise".
#
# Why this file exists
# --------------------
# A whole-part similarity number cannot be trusted or enforced, because it
# conflates three different things:
#
#   1. unintended drift        -- real defects; only these should fail a gate
#   2. intended deviation      -- features removed/added by design
#   3. reference artifacts     -- moulding detail we never meant to copy
#
# Undifferentiated, the aggregate is unactionable: the PoweredUp hub's latch
# scored "closely matching" for 25 rounds while being non-functional, and its
# residual is now dominated by battery ribs we deleted on purpose. Registering
# COMPONENTS with their own regions and thresholds, plus explicitly declared
# accepted deviations, is what separates (1) from (2) and (3).
#
# Checked by: vibe_cading/tools/check_reference_conformance.py
#
# Fields
# ------
#   name            unique id
#   model           module.path.ClassName
#   reference       .stl / .step path (see the CI caveat below)
#   region          [xmin, xmax, ymin, ymax, zmin, zmax] -- the component
#   min_agreement   floor, in percent, on the WORSE of the two directions
#   tolerance       mm; a sample within this counts as agreeing
#
#   [[retired_component.accepted_deviation]]
#     what / why    prose, mandatory -- a deviation without a reason is drift
#     region        optional AABB; when present its samples are EXCLUDED from
#                   scoring, which is what makes the declaration load-bearing
#                   rather than a comment
#
# CI caveat (do not paper over)
# -----------------------------
# Some references are derived from third-party sources that must never be
# committed (for the PoweredUp hub: LDraw parts -- see the design brief). Rows
# whose `reference` is absent are SKIPPED WITH NOTICE, not silently passed.
# Those components are therefore contributor-local checks, not CI gates, and
# the checker says so on every run.

# =====================================================================
# ALL ROWS RETIRED -- 2026-08-28
# =====================================================================
# The rows below are renamed `[[retired_component]]`, which the checker
# does not read. Nothing in this file gates anything today.
#
# Why: every row here scores our geometry against LDraw parts 24853 /
# 25560. Caliper measurements of the REAL parts
# (docs/design_plans/2026-08-28-poweredup-hub_physical-measurements.md)
# put the cover's width at 52.33 mm where LDraw draws 54.400, and the
# housing's cavity at 52.96 where we modelled 54.400. The reference is
# internally consistent to the digit -- +-68.000 LDU exactly, every
# subpart resolving -- and still wrong about the hardware.
#
# So a HIGHER agreement score against it now means a WORSE part. A gate
# that rewards moving away from the real object is not a weak gate, it is
# an inverted one, and re-flooring cannot fix that.
#
# What guards these parts instead: the geometry tests, which assert real
# dimensions to 1e-6 mm -- six orders of magnitude tighter than the
# 0.2 mm surface tolerance these rows used -- plus the kinematic gap and
# clearance tests, which measure the fit between our own two parts and do
# not reference LDraw at all.
#
# Restoring any row requires a reference that has been checked against
# the hardware. The text is kept in full because it records how each
# figure was derived and why the earlier rows were retired; that history
# is why this file is worth keeping at all.
# =====================================================================

