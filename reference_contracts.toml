  NOTE: the 89.0 figure is not directly comparable. It was measured before
  surface_diff's point-to-triangle distance was corrected to use triangle
  EDGES rather than vertices (round 38); the old metric overestimated against
  coarse meshes, so every earlier figure was a lower bound.
  """

  [[retired_component.accepted_deviation]]
  what = "The bend is thicker than the legs (user-directed, round 39)"
  why = """
  SECOND DELIBERATE FLOOR REDUCTION, 55.0 -> 46.0. Reviewed edit, as `--update`
  refuses to lower a floor.

  The bend is the most highly and most cyclically loaded section of the spring,
