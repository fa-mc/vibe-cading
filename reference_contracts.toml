Every row here scored our geometry against LDraw parts 24853 / 25560.
Caliper measurements of the REAL parts, 2026-08-28, put the cover's width at
52.33 mm where LDraw draws exactly 54.400, and the housing's cavity at 52.96
where we had modelled 54.400 -- see
docs/design_plans/2026-08-28-poweredup-hub_physical-measurements.md.

The reference is internally consistent to the digit (+-68.000 LDU, every
subpart resolving, verified straight from the .dat source) and still wrong
about the hardware. So a HIGHER agreement score against it now means a WORSE
part: the gate is not weak, it is inverted, and no floor value fixes that.

Guarding these parts instead: the geometry tests, which assert real dimensions
to 1e-6 mm -- six orders of magnitude tighter than the 0.2 mm surface
tolerance these rows used -- and the kinematic gap/clearance tests, which
measure the fit between our own two parts and never reference LDraw.

Restoring a row requires a reference checked against the hardware. The retired
rows are kept below, renamed so the checker ignores them, because they record
how every figure was derived.
"""

