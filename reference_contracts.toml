  [[retired_component.accepted_deviation]]
  what = "The printed hook is 0.150 mm per side narrower than the reference's, for lateral running clearance"
  why = """
  DELIBERATE FLOOR REDUCTION, 46.0 -> 43.0, round 58. DECLARED WITHOUT A
  REGION, so it keeps counting against this row rather than being scoped out.

  User report from a printed part: "May need to adjust the width of the U hook
  as well to add a little clearance. Currently it gets stuck."

  The reference gives the latch NO lateral clearance at all. Measured off both
  reference meshes (tmp/ldraw/ref_latch_fit.py), 24853's hook and 25560's slot
  both span X 5.600..19.200 -- 13.600 against 13.600, zero per side. That is
  not an omission to correct: LDraw models NOMINAL geometry, and a moulded
  LEGO part takes its working fit from mould tolerance and material. Printed
  on FDM the same pair is a press fit, which is what the user hit.

  The bind was NOT a modelling defect. Measured on the built parts
  (tmp/ldraw/latch_x_gap.py), the housing's round-40 channel allowance already
  delivered a uniform 0.150 mm on all four gaps over the full leg height --
  no taper, no local pinch. 0.150 mm per side is simply too tight here in
  print. User direction was that the HOUSING stays reference-faithful, so the
  second half comes off the cover: the male features narrow by free.radial per
  side, taking the pair to 2 x free.radial = 0.300 mm per side.

  Applied to all four features sharing that footprint -- U ribbon, retention
  bead, pad end walls, scalloped thumb pad -- because narrowing only the
  ribbon would leave the pad jamming in the same slot at full width. The hook
  stays centred on the NOMINAL centre so the clearance splits evenly; deriving
  the centre from the narrowed width would slide it against one wall for the
  same total width and no clearance, and a seated interference check would not
  report it (touching faces measure 0.000 mm^3).

  The cost was ISOLATED before this floor was touched, not inferred
  (tmp/ldraw/latch_u_cost.py rebuilds the cover with the clearance forced to
  each value and scores this exact region):

      clearance 0.000 (pre-round-58)   46.1%   <- the pre-change score exactly
      clearance 0.150 (as shipped)     43.5%

  So the whole 2.6-point drop is the user-directed clearance and nothing else.
  The mechanism is direct: this row's region runs to the nominal footprint, so
  the 0.145 mm strip we vacate on each side is reference material we no longer
  have.

  Retention is unaffected -- it acts in Y, via the bead against the housing's
  land, and the land is still the full 13.600 wide, so the narrowed leg still
  overlaps it completely.

  If the user's fit test shows 0.300 mm per side is still tight, the knob is
